spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./focusflow-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
server:
  port: ${PORT:8080}
app:
  jwt-secret: ${JWT_SECRET:replace-this-with-a-long-random-256-bit-secret-for-production}
  cors-origin: ${CORS_ORIGIN:http://localhost:8000}
